# Stroke classification pipeline configuration

project:
  name: "Stroke Classification Pipeline"
  seed: 42

data:
  base_path: "dataset"
  hf_repo_id: "melisklc0/stroke-classification"
  result_path: "results"
  checkpoint_path: "checkpoints"
  # Binary labels: index 0 = no stroke, index 1 = stroke (matches model logits)
  classes:
    No-Stroke: 0
    Stroke: 1
  image_size: 299 # Normal: 256, Inception/Legacy: 299
  # Data preparation
  cluster_count: 5
  balancing_method: "smote"
  augmentation: true

training:
  type: "cnn" # options: "cnn", "kd", "ensemble"
  folds: ["Fold1", "Fold2", "Fold3"]
  epochs: 2
  batch_size: 32
  learning_rate: 0.0001
  device: "cuda"

model:
  name: "resnet50" # resnet18, resnet50, densenet121, densenet201, efficientnetb0, efficientnetb3, inceptionv3
  num_classes: 2
  pretrained: true
  # Hugging Face Model Hub repo name (without username; user comes from data.hf_repo_id)
  hf_model_id: "efficientnet-b0-stroke-distilled"

kd_training:
  teacher_model: "inceptionv3"
  teacher_weights: "checkpoints/cnn/inceptionv3/inception_best_model_Fold1.pth"
  student_model: "resnet18"
  alpha: 0.5
  temperature: 4.0

ensemble:
  method: "soft_voting" # soft_voting, hard_voting
  validation_mode: "internal" # options: "internal", "external"
  internal_data_path: "dataset/Fold1/test"
  external_data_path: "dataset/External_Dataset/head_ct"
  weights:
    #resnet18: "checkpoints/kd/KD_Resnet18/kd_student2_resnet18_Fold1.pth"
    #resnet50: "checkpoints/kd/KD_Resnet50/kd_student2_resnet50_Fold1.pth"
    #densenet121: "checkpoints/kd/KD_Densenet121/kd_student2_densenet121_Fold1.pth"
    #densenet201: "checkpoints/kd/KD_Densenet201/kd_student2_densenet201_Fold1.pth"
    efficientnetb0: "checkpoints/kd/KD_Efficientnet_b0/kd_efficientnet_b0_Fold1.pth"
    #efficientnetb3: "checkpoints/kd/KD_Efficientnet_b3/kd_efficientnet_b3_Fold1.pth"
